name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ZOLE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zole.jks"
            echo "ZOLE_KEYSTORE_PATH=$RUNNER_TEMP/zole.jks" >> "$GITHUB_ENV"
          fi

      - name: Test and build
        env:
          ZOLE_KEYSTORE_PASSWORD: ${{ secrets.ZOLE_KEYSTORE_PASSWORD }}
          ZOLE_KEY_ALIAS: ${{ secrets.ZOLE_KEY_ALIAS }}
          ZOLE_KEY_PASSWORD: ${{ secrets.ZOLE_KEY_PASSWORD }}
        run: ./gradlew :engine:test :ai:test :app:testDebugUnitTest assembleDebug assembleRelease

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/zole-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/zole.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zole-apk
          path: dist/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/zole.apk
          generate_release_notes: true
